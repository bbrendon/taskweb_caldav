[project]
name = "taskweb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "task-caldav-lib>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "radicale>=3.5"]

[tool.setuptools]
packages = ["app", "app.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
